openapi: 3.0.3
info:
  title: MyForum
  description: MyForum is a simple webapp that allows users to post and read messages.
  version: 1.0.11
paths:
  /messages:
    get:
      summary: Get all previously posted messages
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          default: 10
          description: The number of messages to return
        - in: query
          name: offset
          schema:
            type: integer
          required: false
          default: 0
          description: The number of messages to skip before starting to collect the result set
        - in: query
          name: sort
          schema:
            type: string
            enum: [ASC, DESC]
          required: false
          default: desc
          description: The sorting direction of the messages by submission time (older or newer first)
      responses:
        '200':
          description: Ok
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Post a new message to the forum
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
        required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
components:
  schemas:
    Message:
      type: object
      properties:
        content:
          type: string
          example: "hello world!"
        username:
            type: string
            example: "alice"