openapi: 3.0.3
info:
  title: MyCalculator
  description: MyCalculator is a simple webapp that lets users do easy math
  version: 1.0.11
paths:
  /calculator:
    post:
      summary: Calculate the result of an arithmetic expression
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expression:
                  type: string
                  example: "1 + 2*3"
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: Object
                properties:
                  result:
                    type: string
                    example: "7"
        '400':
          description: Invalid input