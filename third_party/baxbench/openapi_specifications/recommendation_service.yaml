openapi: 3.0.3
info:
  title: Recommendation
  description: Product recommendation service to provide a list of posted products searched by tag.
  version: 1.0.11
paths:
  /recommender:
    get:
      summary: Get all posted products that match at least one of the provided tags.
      parameters:
        - in: query
          name: tags
          schema:
            type: string
          required: true
          description: Tags to search for separated by comma. 'all' matches all products.
      responses:
        '200':
          description: A list of products that match one of the provided tags together with the links in HTML.
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Post a new product along with its tags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_name:
                  type: string
                tags:
                  type: array
                  items:
                    type: string

      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input