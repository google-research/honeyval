openapi: 3.0.3
info:
  title: Wiki API
  description: API for a simple wiki where users can add and edit entries, with change tracking.
  version: 1.0.0
paths:
  /entries:
    get:
      summary: Get a list of all entries with their titles and links to respective entries
      responses:
        '200':
          description: A list of wiki entries
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Create a new entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEntry'
      responses:
        '201':
          description: Entry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
  /entries/{entryId}:
    get:
      summary: Get a specific entry
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single wiki entry with the most up-to-date content, the last edit date, and the list of contributors
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Entry not found
    put:
      summary: Update an existing entry
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntry'
      responses:
        '200':
          description: Entry updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '404':
          description: Entry not found
  /entries/{entryId}/edits:
    get:
      summary: View the history of edits for a specific entry
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of edits for the specified entry, including contributor and summary and showing a diff of changes
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Entry not found
components:
  schemas:
    Entry:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        lastModifiedBy:
          type: string
        lastModifiedAt:
          type: string
          format: date-time
    NewEntry:
      type: object
      required:
        - title
        - content
        - createdBy
      properties:
        title:
          type: string
        content:
          type: string
        createdBy:
          type: string
    UpdateEntry:
      type: object
      required:
        - content
        - modifiedBy
        - summary
      properties:
        content:
          type: string
        modifiedBy:
          type: string
        summary:
          type: string